<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoey — @mysiyau</title>
<meta name="description" content="Zoey · Handmade rhinestone cases by @mysiyau. Follow on Instagram for new drops and custom orders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: #0f0d10;
    color: #f3ead9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }
  /* soft warm glow */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(600px 400px at 50% -5%, rgba(212, 175, 122, 0.22), transparent 70%),
      radial-gradient(500px 500px at 85% 110%, rgba(232, 160, 180, 0.14), transparent 70%),
      radial-gradient(400px 400px at 10% 100%, rgba(150, 200, 255, 0.08), transparent 70%);
    pointer-events: none;
  }
  /* twinkling sparkles */
  .spark {
    position: fixed;
    color: #e8c88a;
    font-size: 10px;
    opacity: 0;
    animation: twinkle 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  .spark:nth-child(1) { top: 12%; left: 18%; animation-delay: 0s; }
  .spark:nth-child(2) { top: 22%; left: 82%; font-size: 13px; animation-delay: 0.8s; }
  .spark:nth-child(3) { top: 68%; left: 8%; font-size: 12px; animation-delay: 1.6s; }
  .spark:nth-child(4) { top: 78%; left: 88%; animation-delay: 2.2s; }
  .spark:nth-child(5) { top: 45%; left: 92%; font-size: 9px; animation-delay: 0.4s; }
  .spark:nth-child(6) { top: 55%; left: 5%; font-size: 9px; animation-delay: 1.2s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 0.9; transform: scale(1.15); }
  }
  main {
    position: relative;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .avatar {
    width: 92px; height: 92px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #e8c88a;
    background: radial-gradient(circle at 35% 30%, #2a2226, #171217);
    border: 1px solid rgba(212, 175, 122, 0.55);
    box-shadow: 0 0 32px rgba(212, 175, 122, 0.25);
  }
  h1 {
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #f6e7c8;
  }
  .handle {
    margin-top: 6px;
    font-size: 15px;
    color: #c9a86a;
    letter-spacing: 0.08em;
  }
  .tagline {
    margin: 16px auto 0;
    font-size: 14.5px;
    line-height: 1.7;
    color: #d8cbb6;
    max-width: 320px;
  }
  .links { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #1a1216;
    background: linear-gradient(135deg, #ecd3a0, #d4af7a);
    box-shadow: 0 6px 24px rgba(212, 175, 122, 0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(212, 175, 122, 0.38); }
  .btn .arrow { font-weight: 400; opacity: 0.7; }
  .btn.ghost {
    background: transparent;
    color: #ecd3a0;
    border: 1px solid rgba(212, 175, 122, 0.45);
    box-shadow: none;
  }
  .btn.ghost:hover { box-shadow: 0 6px 20px rgba(212, 175, 122, 0.18); }
  .note {
    margin-top: 26px;
    font-size: 13px;
    color: #a99a83;
    line-height: 1.6;
  }
  footer {
    margin-top: 34px;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #7d6f5c;
  }
</style>
</head>
<body>
  <span class="spark">✦</span>
  <span class="spark">✦</span>
  <span class="spark">✦</span>
  <span class="spark">✦</span>
  <span class="spark">✦</span>
  <span class="spark">✦</span>
  <main>
    <div class="avatar">✦</div>
    <h1>Zoey</h1>
    <p class="handle">@mysiyau</p>
    <p class="tagline">Handmade rhinestone cases<br>phone · MacBook · iPad — made to sparkle</p>
    <div class="links">
      <a class="btn" href="https://www.instagram.com/mysiyau" target="_blank" rel="noopener">Instagram <span class="arrow">→</span></a>
      <!-- TODO: Etsy + Shopify links — add once lin sends the shop URLs -->
    </div>
    <p class="note">Custom orders — DM on Instagram</p>
    <footer>ZOEY.LOC.CC</footer>
  </main>
</body>
</html>
